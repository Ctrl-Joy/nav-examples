# NAV blueprint: a Postgres database and a web service that uses it.
# In the dashboard: Blueprints > New Blueprint, point it at this repository.
databases:
  - name: hello-db
    plan: free
    databaseName: hello
    user: hello

services:
  - type: web
    name: hello-postgres
    runtime: node
    rootDir: hello-postgres
    plan: free
    startCommand: node server.js
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: hello-db, property: connectionString }
